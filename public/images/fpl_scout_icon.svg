<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="pitchGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#02b355"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" rx="56" fill="#0b0f0d"/>

  <g transform="translate(160,160)">
    <circle cx="0" cy="0" r="145" fill="url(#glow2)"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#pitchGreen2)" stroke-width="7" filter="url(#softGlow2)"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#00ff87" stroke-width="3.5" opacity="0.55"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00ff87" stroke-width="3.5" opacity="0.55"/>

    <g>
      <circle r="78" fill="#eafff3"/>
      <polygon points="0,-32 30,-10 18,28 -18,28 -30,-10" fill="#0b0f0d"/>
      <g stroke="#0b0f0d" stroke-width="3.2" fill="none">
        <path d="M 0,-32 L 0,-78"/>
        <path d="M 30,-10 L 74,-24"/>
        <path d="M 18,28 L 45,67"/>
        <path d="M -18,28 L -45,67"/>
        <path d="M -30,-10 L -74,-24"/>
        <path d="M 0,-78 A 78 78 0 0 1 74,-24" fill="none" stroke="#0b0f0d" stroke-width="3.2"/>
      </g>
    </g>
  </g>
</svg>
