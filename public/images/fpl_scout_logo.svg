<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="pitchGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#02b355"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#0b0f0d"/>

  <!-- ============ VARIANT 1: Icon + wordmark (main lockup) ============ -->
  <g transform="translate(60,60)">
    <circle cx="150" cy="150" r="145" fill="url(#glow)"/>

    <!-- Pitch circle base -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="url(#pitchGreen)" stroke-width="6" filter="url(#softGlow)"/>

    <!-- Pitch center line + circle (mini stadium view) -->
    <line x1="150" y1="30" x2="150" y2="270" stroke="#00ff87" stroke-width="3" opacity="0.55"/>
    <circle cx="150" cy="150" r="40" fill="none" stroke="#00ff87" stroke-width="3" opacity="0.55"/>

    <!-- Simplified football (classic panel pattern) at center, scaled down -->
    <g transform="translate(150,150)">
      <circle r="72" fill="#eafff3"/>
      <polygon points="0,-30 28,-9 17,26 -17,26 -28,-9" fill="#0b0f0d"/>
      <g stroke="#0b0f0d" stroke-width="3" fill="none">
        <path d="M 0,-30 L 0,-72"/>
        <path d="M 28,-9 L 68,-22"/>
        <path d="M 17,26 L 42,62"/>
        <path d="M -17,26 L -42,62"/>
        <path d="M -28,-9 L -68,-22"/>
        <path d="M 0,-72 A 72 72 0 0 1 68,-22" fill="none" stroke="#0b0f0d" stroke-width="3"/>
      </g>
    </g>

    <!-- corner arc accents -->
    <path d="M 30 30 A 20 20 0 0 1 50 10" fill="none" stroke="#00ff87" stroke-width="3" opacity="0.4"/>
    <path d="M 270 30 A 20 20 0 0 0 250 10" fill="none" stroke="#00ff87" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Wordmark -->
  <text x="340" y="185" font-size="92" font-weight="800" letter-spacing="1">
    <tspan fill="#eafff3">FPL </tspan><tspan fill="#00ff87">Scout</tspan>
  </text>
  <text x="342" y="225" font-size="26" font-weight="400" fill="#7fdba0" letter-spacing="4">PLAYER · ANALYTICS · ENGINE</text>

</svg>
